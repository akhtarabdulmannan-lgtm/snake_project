<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="game">
    <header class="game__header">
        <h1>Snake</h1>
        <p class="game__subtitle">Plain HTML + CSS + JavaScript. No build step.</p>
    </header>

    <section class="hud" aria-label="Game statistics">
        <div class="hud__item">
            <span class="hud__label">Score</span>
            <span class="hud__value" id="score">0</span>
        </div>
        <div class="hud__item">
            <span class="hud__label">Best</span>
            <span class="hud__value" id="highScore">0</span>
        </div>
        <div class="hud__item">
            <span class="hud__label">Speed</span>
            <span class="hud__value" id="level">1</span>
        </div>
    </section>

    <div class="board">
        <canvas id="gameCanvas" width="400" height="400" aria-label="Snake game board"></canvas>

        <div class="overlay" id="overlay">
            <h2 class="overlay__title" id="overlayTitle">Ready?</h2>
            <p class="overlay__text" id="overlayText">
                Press Enter, or click the button, to start.
            </p>
            <button class="btn btn--primary" id="startBtn" type="button">Start game</button>
        </div>
    </div>

    <div class="controls">
        <button class="btn" id="pauseBtn" type="button" disabled>Pause</button>
        <button class="btn" id="restartBtn" type="button">Restart</button>
    </div>

    <p class="info" id="info" role="status" aria-live="polite">
        Arrow keys or W A S D to steer. Space pauses. Enter restarts.
    </p>
</main>

<script>
    // ===== GAME SETUP =====
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    // ===== DOM ELEMENTS =====
    const scoreEl = document.getElementById("score");
    const infoEl = document.getElementById("info");
    const overlayEl = document.getElementById("overlay");
    const overlayTitleEl = document.getElementById("overlayTitle");
    const overlayTextEl = document.getElementById("overlayText");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");

    // ===== TIMING AND DIFFICULTY =====
    const BASE_INTERVAL = 150;   // ms per tick at speed level 1

    // ===== INITIAL STATE =====
    const START_SNAKE = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];
    const START_FOOD = { x: 15, y: 15 };

    let snake = START_SNAKE.map((segment) => ({ x: segment.x, y: segment.y }));
    let direction = { x: 1, y: 0 };
    let nextDirections = [];     // small buffer so quick key presses are not lost
    let food = { x: START_FOOD.x, y: START_FOOD.y };
    let score = 0;
    let status = "ready";        // ready | running | paused | over
    let timerId = null;          // at most one pending timer, ever

    // ===== DRAWING =====
    const drawGame = () => {
        // board background
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // grid lines
        ctx.strokeStyle = "rgba(148, 163, 184, 0.14)";
        ctx.lineWidth = 1;
        for (let i = 1; i < tileCount; i += 1) {
            const line = i * gridSize + 0.5;
            ctx.beginPath();
            ctx.moveTo(line, 0);
            ctx.lineTo(line, canvas.height);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, line);
            ctx.lineTo(canvas.width, line);
            ctx.stroke();
        }

        // food
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.arc(
            food.x * gridSize + gridSize / 2,
            food.y * gridSize + gridSize / 2,
            gridSize / 2 - 2,
            0,
            Math.PI * 2
        );
        ctx.fill();

        // snake: head is brighter than the body
        snake.forEach((segment, index) => {
            ctx.fillStyle = index === 0 ? "#4ade80" : "#16a34a";
            ctx.fillRect(
                segment.x * gridSize + 1,
                segment.y * gridSize + 1,
                gridSize - 2,
                gridSize - 2
            );
        });
    };

    // ===== HUD AND OVERLAY =====
    const updateHud = () => {
        scoreEl.textContent = String(score);
    };

    const setInfo = (message) => {
        infoEl.textContent = message;
    };

    const showOverlay = (title, text, buttonLabel) => {
        overlayTitleEl.textContent = title;
        overlayTextEl.textContent = text;
        startBtn.textContent = buttonLabel;
        overlayEl.classList.add("overlay--visible");
    };

    const hideOverlay = () => {
        overlayEl.classList.remove("overlay--visible");
    };

    // ===== TIMER (single source of truth) =====
    const stopTimer = () => {
        if (timerId !== null) {
            clearTimeout(timerId);
            timerId = null;
        }
    };

    const scheduleTick = () => {
        stopTimer();                 // guarantees no duplicate timers
        timerId = setTimeout(gameLoop, BASE_INTERVAL);
    };

    // ===== GAME LOGIC =====
    const spawnFood = () => {
        const freeCells = [];
        for (let x = 0; x < tileCount; x += 1) {
            for (let y = 0; y < tileCount; y += 1) {
                const occupied = snake.some(
                    (segment) => segment.x === x && segment.y === y
                );
                if (!occupied) {
                    freeCells.push({ x: x, y: y });
                }
            }
        }

        if (freeCells.length === 0) {
            endGame("You filled the whole board. Perfect game!", "You win!");
            return false;
        }

        const pick = Math.floor(Math.random() * freeCells.length);
        food = freeCells[pick];
        return true;
    };

    const isOpposite = (a, b) => a.x === -b.x && a.y === -b.y;

    const queueDirection = (candidate) => {
        const reference = nextDirections.length > 0
            ? nextDirections[nextDirections.length - 1]
            : direction;

        // ignore reversals and key repeats, and keep the buffer short
        if (isOpposite(candidate, reference)) return false;
        if (candidate.x === reference.x && candidate.y === reference.y) return false;
        if (nextDirections.length >= 2) return false;

        nextDirections.push(candidate);
        return true;
    };

    const applyQueuedDirection = () => {
        if (nextDirections.length > 0) {
            direction = nextDirections.shift();
        }
    };

    const endGame = (message, title) => {
        status = "over";
        stopTimer();

        updateHud();
        drawGame();
        showOverlay(
            title || "Game over",
            message + " Final score: " + score + ".",
            "Play again"
        );
        setInfo("Game over. Press Enter or click Play again.");
    };

    const step = () => {
        if (status !== "running") return;

        applyQueuedDirection();

        const head = {
            x: snake[0].x + direction.x,
            y: snake[0].y + direction.y
        };

        // wall collision
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
            endGame("You hit the wall.");
            return;
        }

        // self collision: the tail tip leaves its cell this tick unless we grow
        const willGrow = head.x === food.x && head.y === food.y;
        const body = willGrow ? snake : snake.slice(0, -1);
        const hitsSelf = body.some(
            (segment) => segment.x === head.x && segment.y === head.y
        );

        if (hitsSelf) {
            endGame("You ran into your own body.");
            return;
        }

        snake.unshift(head);

        if (willGrow) {
            score += 1;
            updateHud();
            if (!spawnFood()) return; // board full: endGame already ran
        } else {
            snake.pop();
        }

        drawGame();
    };

    const gameLoop = () => {
        if (status !== "running") return;

        step();

        if (status === "running") {
            timerId = setTimeout(gameLoop, BASE_INTERVAL);
        }
    };

    // ===== GAME STATE TRANSITIONS =====
    const resetGame = () => {
        stopTimer();

        snake = START_SNAKE.map((segment) => ({ x: segment.x, y: segment.y }));
        direction = { x: 1, y: 0 };
        nextDirections = [];
        score = 0;
        status = "ready";

        food = { x: START_FOOD.x, y: START_FOOD.y };
        if (snake.some((segment) => segment.x === food.x && segment.y === food.y)) {
            spawnFood();
        }

        updateHud();
        drawGame();
        showOverlay(
            "Ready?",
            "Arrow keys or W A S D to steer. Press Enter to start.",
            "Start game"
        );
        setInfo("Arrow keys or W A S D to steer. Space pauses. Enter restarts.");
    };

    const beginPlay = () => {
        status = "running";
        hideOverlay();
        setInfo("Arrow keys or W A S D to steer. Space pauses. Enter restarts.");
        updateHud();
        scheduleTick();
    };

    const startGame = () => {
        if (status === "running") return;
        resetGame();
        beginPlay();
    };

    const restartGame = () => {
        resetGame();
        beginPlay();
    };

    // ===== KEYBOARD CONTROLS =====
    const KEY_DIRECTIONS = {
        ArrowUp: { x: 0, y: -1 },
        ArrowDown: { x: 0, y: 1 },
        ArrowLeft: { x: -1, y: 0 },
        ArrowRight: { x: 1, y: 0 },
        w: { x: 0, y: -1 },
        s: { x: 0, y: 1 },
        a: { x: -1, y: 0 },
        d: { x: 1, y: 0 }
    };

    const handleKeyDown = (event) => {
        const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;

        // arrow keys / WASD
        if (KEY_DIRECTIONS[key]) {
            event.preventDefault();

            if (status === "ready") {
                startGame();
            }
            if (status === "running") {
                queueDirection(KEY_DIRECTIONS[key]);
            }
            return;
        }

        // enter = start / restart / resume
        if (key === "Enter") {
            event.preventDefault();
            startGame();
        }
    };

    // ===== EVENT WIRING =====
    document.addEventListener("keydown", handleKeyDown);
    startBtn.addEventListener("click", startGame);
    restartBtn.addEventListener("click", restartGame);

    // ===== BOOT =====
    resetGame();
    updateHud();
</script>

</body>
</html>
